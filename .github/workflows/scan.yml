name: scan

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 IST — morning digest
    - cron: "30 12 * * *" # 18:00 IST — evening urgency sweep
  workflow_dispatch: # manual "check now" button in the Actions tab
    inputs:
      add_url:
        description: "Optional: hackathon URL to track (link-drop). Leaves blank for a normal scan."
        required: false
        type: string

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run the daily job
        run: npm run scan -- ${{ github.event.inputs.add_url && format('--add-url {0}', github.event.inputs.add_url) || '' }}
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # The commit doubles as the audit log AND keeps the schedule from
      # auto-disabling after 60 days of inactivity.
      - name: Commit state.json if it changed
        run: |
          git config user.name "submission-window"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "scan: update state.json [skip ci]" && git push)
